name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to full commit SHAs so a moved or hijacked tag
      # can't change what runs. Dependabot keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The React tests run in real Chromium. The browser build is the one
      # pinned by the exact playwright version.
      - run: pnpm --filter @sillon/react exec playwright install --with-deps chromium
      - run: pnpm test
      # tsdown runs publint and are-the-types-wrong on the built packages.
      - run: pnpm build
      - run: pnpm build:site
