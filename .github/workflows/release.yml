name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

jobs:
  # Opens or updates the "Version packages" PR from pending changesets, and
  # decides whether a release is due. It has no way to talk to npm.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the version-packages branch
      pull-requests: write # the "Version packages" PR
    outputs:
      stage: ${{ steps.due.outputs.stage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          pr-title: Version packages
          commit-message: Version packages
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # With no changesets pending, a release is due if this version isn't on
      # npm. Both packages share one version (see .changeset/config.json).
      - id: due
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          # The first version of each package is published by hand (see the README),
          # since trusted publishing can only be set up for a package that exists.
          if ! npm view "@sillon/core" name >/dev/null 2>&1 || ! npm view "@sillon/react" name >/dev/null 2>&1; then
            echo "The packages aren't on npm yet; publish the first version by hand."
            echo "stage=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(node -p "require('./packages/core/package.json').version")
          if npm view "@sillon/core@$version" version >/dev/null 2>&1 &&
             npm view "@sillon/react@$version" version >/dev/null 2>&1; then
            echo "@sillon/core and @sillon/react $version are already on npm."
            echo "stage=false" >> "$GITHUB_OUTPUT"
          else
            echo "$version is not on npm yet; staging it."
            echo "stage=true" >> "$GITHUB_OUTPUT"
          fi

  # Stages the release on npm. Runs in the protected `npm` environment, so a
  # maintainer must approve the job in GitHub, and npm then holds each staged
  # version until a maintainer approves it again with 2FA. This is the only
  # job that can mint an npm OIDC token.
  stage:
    needs: version
    if: needs.version.outputs.stage == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # the release tags
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm >= 11.15. Pinned exactly, no ranges.
      - run: npm install -g npm@11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # pnpm pack swaps workspace:^ for the real version range; npm publishes
      # the tarball. Core first: react depends on it. A package already on npm
      # at this version (a re-run after one of them went out) is skipped.
      - name: Stage on npm
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          for pkg in core react; do
            if npm view "@sillon/$pkg@$version" version >/dev/null 2>&1; then
              echo "@sillon/$pkg@$version is already on npm."
              continue
            fi
            (cd "packages/$pkg" && pnpm pack --pack-destination "$RUNNER_TEMP")
            npm stage publish "$RUNNER_TEMP/sillon-$pkg-$version.tgz"
          done
      - name: Tag the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          for pkg in core react; do
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/@sillon/$pkg@$version" -f sha="$GITHUB_SHA" ||
              echo "Tag @sillon/$pkg@$version already exists."
          done
