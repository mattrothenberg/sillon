packages:
  - packages/*
  - apps/*
  - scripts

# Refuse to resolve any dependency version published less than 3 days ago.
# Supply-chain worms are usually detected and unpublished within hours, so this
# keeps freshly poisoned releases out of the tree. Applies to resolution and to
# verifying the committed lockfile on install.
minimumReleaseAge: 4320

# Dependencies with install scripts. sharp (Astro's image service) ships
# prebuilt binaries as optional dependencies; its install script isn't needed.
allowBuilds:
  sharp: false
