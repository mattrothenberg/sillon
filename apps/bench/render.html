<!doctype html><html><head><meta charset="utf-8"><title>render bench</title>
<style>
  :root { --wave-a: #8b5cf6; --wave-b: #ec4899; --played-a: #f59e0b; --played-b: #ef4444; }
  body { margin: 0; background: #0b0b10; padding: 24px; }
  #stage { position: relative; width: 1200px; height: 128px; }
  /* HTML-background strategies: any CSS background shows through the waveform shape. */
  .wave { position: absolute; inset: 0; background: linear-gradient(90deg, var(--wave-a), var(--wave-b)); opacity: 1; }
  .played { position: absolute; inset: 0; background: linear-gradient(90deg, var(--played-a), var(--played-b)); transform-origin: 0 0; }
  .track { position: absolute; inset: 0; background: linear-gradient(90deg, var(--wave-a), var(--wave-b)); opacity: .35 }
</style></head>
<body><div id="stage"></div><script type="module" src="/src/render.ts"></script></body></html>
